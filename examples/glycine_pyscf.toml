# pKa prediction for glycine using PySCF backend
#
# Three-stage workflow:
#   1. Sampling   — CREST conformer/tautomer/protonation enumeration (GFN2-xTB)
#   2. Refinement — geometry optimization (wB97X-3c/vDZP + IEF-PCM) + xTB RRHO
#   3. Scoring    — single-point energy (wB97M-V/def2-QZVPPD + IEF-PCM)

[molecule]
smiles = "NCC(=O)O"
charge_min = -1
charge_max = 1
solvent = "water"

[sampling]
approach = "rdkit_first"
ewin = 6.0

[refinement]
# PySCF defaults: wB97X-3c / vDZP, minimized in IEF-PCM
ewin = 8.0
rrho = "xtb"

[scoring]
# PySCF defaults: wB97M-V / def2-QZVPPD / IEF-PCM
ewin = 10.0

[compute]
driver = "pyscf"
threads = 8
output_dir = "glycine_output"
