# pKa prediction for glycine with the "fast" protocol: OrbMol-v2 refinement.
#
# Three-stage workflow:
#   1. Sampling   — CREST conformer/tautomer/protonation enumeration (GFN2-xTB),
#                   with a wide window because refinement is cheap
#   2. Refinement — geometry optimization with the OrbMol-v2 machine-learned
#                   potential (gas phase; wB97M-V/def2-TZVPD-quality), then a
#                   wB97X-3c/vDZP solvation energy on that geometry + xTB RRHO
#   3. Scoring    — single-point energy (wB97M-V/def2-TZVPPD + IEF-PCM)
#
# OrbMol-v2 has no implicit solvent, so it can only refine: [compute] driver
# runs scoring and every DFT job, and must stay psi4 or pyscf.  The solvation
# single point is what keeps the refinement filter ranking on the same physics
# scoring does — a gas-phase filter reranks badly against solvated scoring.

protocol = "fast"

[molecule]
smiles = "NCC(=O)O"
charge_min = -1
charge_max = 1
solvent = "water"

# The protocol sets every level of theory and window below; each key here just
# restates one of its defaults (see PROTOCOLS in tautomator/config.py).

[refinement]
method = "OrbMol-v2"  # an OrbMol model name is what selects OrbMol
ewin = 6.0
rrho = "xtb"  # or "refinement" for the OrbMol-v2 Hessian
# Skip the solvation single point for conformers already this far above the
# gas-phase minimum; they are recorded as "gas_prefilter" exclusions.
solvation_prefilter_ewin = 12.0

[compute]
driver = "pyscf"
threads = 8
output_dir = "glycine_orbmol_output"
