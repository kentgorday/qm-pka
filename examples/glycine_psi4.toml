# pKa prediction for glycine using Psi4 backend
#
# Psi4 refinement minimizes in gas phase (wB97X-3c/vDZP) because Psi4 lacks
# analytical PCM gradients, then adds an IEF-PCM single point on that
# geometry so the refinement filter ranks on solvated energies.

[molecule]
smiles = "NCC(=O)O"
charge_min = -1
charge_max = 1
solvent = "water"

[sampling]
approach = "crest_first"
ewin = 6.0
prescreen_mode = "quick"
full_mode = "default"

[refinement]
# Psi4 defaults: wB97X-3c / vDZP, gas minimization + an IEF-PCM single point
ewin = 8.0

[scoring]
# Psi4 defaults: wB97M-V / def2-QZVPPD / IEFPCM
ewin = 10.0

[compute]
driver = "psi4"
threads = 8
output_dir = "glycine_output"
