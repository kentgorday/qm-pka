# pKa prediction for glycine using Psi4 backend
#
# Three-stage workflow:
#   1. Sampling   — CREST conformer/tautomer/protonation enumeration (GFN2-xTB)
#   2. Refinement — geometry optimization (wB97X-3c/vDZP + IEF-PCM) + xTB RRHO
#   3. Scoring    — single-point energy (wB97M-V/def2-QZVPPD + IEF-PCM)
#
# Psi4's IEF-PCM comes from psi4-swig-pcm (installed by `pixi install -e psi4`):
# PySCF's model with analytical gradients, so it minimizes in solvent.

[molecule]
smiles = "NCC(=O)O"
charge_min = -1
charge_max = 1
solvent = "water"

[sampling]
approach = "crest_first"
ewin = 6.0
prescreen_mode = "quick"
full_mode = "default"

[refinement]
# Psi4 defaults: wB97X-3c / vDZP, minimized in IEF-PCM
ewin = 8.0

[scoring]
# Psi4 defaults: wB97M-V / def2-QZVPPD / IEF-PCM
ewin = 10.0

[compute]
driver = "psi4"
threads = 8
output_dir = "glycine_output"
