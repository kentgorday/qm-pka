[workspace]
channels = ["conda-forge"]
name = "qm-pka"
platforms = ["linux-64", "osx-arm64"]
version = "0.1.0"

[tasks]
lint = "ruff check qm_pka/ tests/ scripts/"
format = "ruff format qm_pka/ tests/ scripts/"
format-check = "ruff format --check qm_pka/ tests/ scripts/"
typecheck = "mypy qm_pka/ tests/ scripts/"
check = { depends-on = ["lint", "format-check", "typecheck"] }

[dependencies]
# Without a pin, a fresh solve (a full relock, or any new environment) settles on
# Python 3.11 on linux-64, which the package's requires-python >=3.13 rejects.
python = "3.13.*"
# Pin CREST 2.12 (not 3.x). The CREST 3.x rewrite moved optimization/MD/MTD
# in-process; on macOS its conformer search collapses every ensemble to a single
# structure (verified: n-pentane gives 1 conformer on 3.0.2 vs 6 on 2.12, on both
# osx-arm64 and osx-64-under-Rosetta; cf. crest-lab/crest#407,#411,#412). 2.12
# drives the external xtb binary and works. single_point() and frequencies() call
# xtb directly (CREST 2.x has no --sp run mode).
crest = "2.12.*"
gcp-correction = ">=2.3.2,<3"
# Floor xtb at 6.7.1. gcp-correction 2.3.2 build 2 requires mctc-lib >=0.5.1; without
# this floor the solver falls back to xtb 6.4.1 (the last release with no mctc-lib
# dependency) instead of the newer builds rebuilt against mctc-lib 0.5.x. xtb 6.7.1
# build >=4 also fixes the build-2 Fortran format-string bug (grimme-lab/xtb#1332).
xtb = ">=6.7.1"
psi4 = ">=1.10,<2"
# libxc 7.1 removed functionals (mgga_x_ms2bs, mgga_x_mvsb, gga_xc_th_fl, ...)
# that Psi4 1.10 builds into its functional table at import, so Psi4 1.10 dies on
# import with 7.1.x.  Newer Psi4 is out of reach (it needs pybind11-abi 11; PySCF
# needs xcfun 2.1.1, built only against abi 4 for Python 3.13).  This pin also
# keeps PySCF below 2.14, which requires libxc >=7.1.2.
libxc-c = "7.0.*"
rdkit = ">=2024.03,<2026"
pytest = ">=9.0.3,<10"
mypy = ">=1.20.0,<2"
# DFT backends: Psi4 (subprocess) and PySCF (Python library).
# Psi4: wB97X-3c gas-phase (no analytical PCM gradients).
# PySCF: wB97X-3c/vDZP (default refinement) or wB97M-V + SMD (scoring).
# PySCF 2.13.1 rewrote its dispersion dispatch (PR #3209); pyscf_runner detects
# which dispatch it has and sets the D4 composites up accordingly.  Verified on
# 2.11.0, 2.13.1 and 2.14.0 (2.7.0-2.13.0 share 2.11's dispersion code).  The
# upper bound is the last verified release: v2.16 has announced further
# dispersion changes, so re-run the pyscf tests on it before raising it.
pyscf = ">=2.7,<2.15"
# Dispersion corrections.  dftd3-python and dftd4-python provide the libraries
# Psi4 uses.  PySCF does not use them: pyscf-dispersion bundles its own
# libdftd4/libs-dftd3, whose parameter names differ by release (see
# pyscf_runner._D4_PARAMS).  pyscf-dispersion >=1.3 because 1.2 bundles dftd4
# 3.6.0, which does not know "wb97x-3c" or "wb97x-rev".
dftd3-python = ">=1.0"
dftd4-python = ">=4.0"
pyscf-dispersion = ">=1.3"
# Basis set exchange: provides vDZP basis set for wB97X-3c (not in PySCF's
# built-in basis library).
basis_set_exchange = ">=0.12,<0.13"
# geomeTRIC: geometry optimizer used by PySCF and OrbMol for the refinement stage.
geometric = ">=1.0"
# OrbMol-v2 (orb-models, PyPI only): machine-learned refinement driver.  torch,
# dm-tree and ase come from conda-forge.  orb-models pins dm-tree==0.1.8, which
# has no PyPI wheel for CPython 3.13 and whose conda-forge builds need libabseil
# 2024 (conflicts with current pytorch); it only uses tree.map_structure/flatten,
# unchanged since, so the pin is overridden below.  conda-forge pytorch >=2.10 is
# built against pybind11-abi 11 while PySCF's xcfun needs abi 4, so the solver
# holds torch at 2.8/2.9.  On linux-64 the only torch that coexists with Psi4 is
# the cpu_mkl build, which switches libblas to MKL.
pytorch = ">=2.8"
dm-tree = ">=0.1.8"
ase = ">=3.25,<4"

[pypi-dependencies]
qm-pka = { path = ".", editable = true }
ruff = ">=0.11,<1"
orb-models = ">=0.7.0,<0.8"

[pypi-options.dependency-overrides]
dm-tree = ">=0.1.8"

