# pKa prediction for 3-amino-2-butanol
# Sampling: RDKit-first | Driver: Psi4
#
# Three-stage workflow:
#   1. Sampling   — RDKit tautomer/charge enum + CREST conformers (GFN2-xTB)
#   2. Refinement — gas-phase geometry optimization (wB97X-3c/vDZP), then one
#                   IEF-PCM single point on that geometry + xTB RRHO
#   3. Scoring    — single-point energy (wB97M-V/def2-QZVPPD + IEFPCM)
#
# Note: Psi4 lacks analytical PCM gradients, so it minimizes in gas phase.
# Solvation still enters the refinement filter, as a single point on the
# optimized geometry ([refinement] solvation = "single_point", the default
# here); without it the filter would rank on gas energies and rerank badly
# against solvated scoring.

[molecule]
smiles = "CC(O)C(N)C"
charge_min = -2
charge_max = 2
solvent = "water"

[sampling]
approach = "rdkit_first"
ewin = 10.0

[refinement]
# Psi4 defaults: wB97X-3c / vDZP, gas minimization + an IEF-PCM single point
ewin = 8.0
rrho = "xtb"

[scoring]
# Psi4 defaults: wB97M-V / def2-QZVPPD / IEFPCM
ewin = 10.0

[compute]
driver = "psi4"
threads = 8
output_dir = "aminobutanol_rdkit_psi4_output"
